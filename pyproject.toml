[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-kanban-workflow"
version = "0.1.0"
description = "Fail-closed workflow controls for Hermes Kanban"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2,<3", "cryptography>=42", "typer>=0.12", "fastapi>=0.110"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_kanban_workflow"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hermes_kanban_workflow"]

